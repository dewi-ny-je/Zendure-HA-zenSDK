####################################################################################
# Zendure zenSDK by Gielz1986 - home energy meter package
# Homewizard P1 - local API v1
#
# Install ONLY the package file of the meter you actually own. The RESTful
# integration polls the address every second, and every failed poll is written
# to the log, so an address that does not answer floods home-assistant.log.
#
# How to use
#   1. Copy this file into the same Home Assistant `packages` folder as
#      zendure_gielz1986_global.yaml (EN) or zendure_gielz1986_nl.yaml (NL).
#   2. Replace <IP-HOMEWIZARD-P1> below with the IP-address of your meter.
#   3. Restart Home Assistant. The meter is then available as:
#
#        sensor.p1_homewizard_api_v1
#
#   4. Fill that entity in on the settings dashboard:
#        Global (EN): Home Energy Meter Sensor  (input_text.home_energy_setting_meter_sensor)
#        Dutch  (NL): Afwijkende P1 sensor      (input_text.afwijkende_p1_sensor)
#      It then takes priority over the built-in Homewizard reading.
#   5. Give the meter a fixed IP-address (DHCP reservation in your router), so
#      the address in this file cannot change.
#
# Expected reading: +watt = import from the grid, -watt = export to the grid.
#
# The local API must be enabled in the Homewizard Energy app.
# Already using the Homewizard IP-address field on the settings
# dashboard? Then you do not need this file - the optional package
# zendure_gielz1986_homewizard_global.yaml / _nl.yaml covers the
# same meter and needs no sensor name to be filled in.
####################################################################################

rest:
  - resource: http://<IP-HOMEWIZARD-P1>/api/v1/data
    scan_interval: 1
    sensor:
      - name: "P1 Homewizard API v1"
        unique_id: P1_Homewizard_API_V1
        # Guard against a meter that is unreachable or still booting: without
        # these checks the template raises "'value_json' is undefined" and the
        # error is logged on every single poll.
        availability: "{{ value_json is defined and value_json.active_power_w is defined }}"
        value_template: >
          {% if value_json is defined and value_json.active_power_w is defined %}
            {{ value_json.active_power_w | float(0) }}
          {% else %}
            {{ None }}
          {% endif %}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
